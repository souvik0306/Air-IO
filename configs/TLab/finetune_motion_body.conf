general:
{
   exp_dir: experiments/tlab_finetune
}

dataset:
{
   include "../datasets/TLab/tlab_body.conf"
   collate: {type: motion}
}

train:
{
   network: codewithrot
   pretrained_ckpt: ./AirIO_EuRoC/AirIO_checkpoint/best_model.ckpt

   lr: 3e-5
   min_lr: 5e-7
   batch_size: 32
   max_epoches: 30
   patience: 6
   factor: 0.5
   weight_decay: 5e-6

   weight: 1e2
   cov_weight: 5e-5
   propcov: True
   covaug: True
   loss: Huber_loss05
   rotloss: Huber_loss005

   save_freq: 5
   eval_freq: 1
}