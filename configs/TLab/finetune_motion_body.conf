general:
{
   exp_dir: experiments/tlab_finetune_30th_September_Gain_loss_0_02
   wandb_project: AirIOtlab_finetune
}

dataset:
{
   include "../datasets/TLab/tlab_body.conf"
   collate: {type: motion}
}

train:
{
   network: codewithrot
   pretrained_ckpt: ./AirIO_EuRoC/AirIO_checkpoint/best_model.ckpt

   lr: 3e-5
   min_lr: 5e-7
   batch_size: 64
   max_epoches: 30
   patience: 6
   factor: 0.5
   weight_decay: 5e-6

   weight: 1e2
   cov_weight: 5e-5
   propcov: True
   covaug: True
   loss: normalized_squared_velocity
   s0: 0.25
   ccc_weight: 0.25
   ccc_tau: 0.1
   gain_weight: 0.02
   gain_min_rms: 0.1
   rotloss: Huber_loss005

   # Balance training windows by motion regimes discovered jointly from GT
   # velocity/acceleration/displacement and raw accelerometer/gyroscope dynamics.
gmm_sampling: 
   {
      enabled: True
      components: 12
      iterations: 100
      seed: 17

      balance_power: 0.5
      rarity_strength: 0.0

      min_weight: 0.5
      max_weight: 2.5

      epoch_multiplier: 1.0
      cache_path: gmm_weights/tlab_train_weights.npz
   }

   save_freq: 5
   eval_freq: 1
}
