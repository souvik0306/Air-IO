general:
{
   exp_dir: experiments/tlab_finetune
   wandb_project: AirIOtlab_finetune
}

dataset:
{
   include "../datasets/TLab/tlab_body.conf"
   collate: {type: motion}
}

train:
{
   network: codewithrot
   pretrained_ckpt: ./AirIO_EuRoC/AirIO_checkpoint/best_model.ckpt

   lr: 3e-5
   min_lr: 5e-7
   batch_size: 32
   max_epoches: 30
   patience: 6
   factor: 0.5
   weight_decay: 5e-6

   weight: 1e2
   cov_weight: 5e-5
   propcov: True
   covaug: True
   loss: Huber_loss05
   # Emphasize aggressive-flight samples without changing the mean loss scale.
   speed_weighted_loss: True
   huber_delta: 0.05
   speed_weight_start: 2.0
   speed_weight_range: 2.0
   speed_weight_gain: 2.0
   # Huber <= 2.5 m/s, 50/50 at 3.0 m/s, and MSE >= 3.5 m/s.
   mse_start_speed: 2.5
   mse_end_speed: 3.5
   mag_weight: 0.1
   rotloss: Huber_loss005

   # Balance training windows by motion regimes discovered jointly from GT
   # velocity/acceleration/displacement and raw accelerometer/gyroscope dynamics.
   gmm_sampling: {
      enabled: True
      components: 12
      iterations: 100
      seed: 17

      balance_power: 0.5
      rarity_strength: 0.0

      min_weight: 0.5
      max_weight: 2.5

      epoch_multiplier: 1.0
      cache_path: experiments/tlab_finetune/gmm_weights.npz
   }

   save_freq: 5
   eval_freq: 1
}
