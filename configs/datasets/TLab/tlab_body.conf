inference:
{
    mode: infevaluate
    coordinate: body_coord
    rot_type: integration
    rot_path: ./orientations/orientation_output.pickle
    data_list:
    [   
        # Older July flights are intentionally disabled for the September-only
        # infevaluate diversity report.
        {name: TLab
        window_size: 200
        step_size: 4
        data_root: ./T-Lab_31st_July_dataset
        data_drive: [RAW/flight_1, RAW/flight_3, RAW/flight_4, RAW/flight_5, RAW/flight_6, RAW/flight_7, RAW/flight_8, RAW/flight_9, UN/flight_1, UN/flight_2, UN/flight_3, UN/flight_4, UN/flight_5, UN/flight_6, UN/flight_7, UN/flight_8]
        },
        {name: TLab
        window_size: 200
        step_size: 4
        data_root: ./T-Lab_28th_July_dataset
        data_drive: [RAW/flight_1, RAW/flight_2, RAW/flight_3, RAW/flight_4, RAW/flight_5, RAW/flight_6, RAW/flight_7, UN/flight_1, UN/flight_2, UN/flight_3, UN/flight_4, UN/flight_5, UN/flight_6, UN/flight_7]
        },
        {name: TLab
        window_size: 200
        step_size: 4
        data_root: ./T-Lab_10th_September_dataset
        data_drive: [High-Dynamic/AI/flight_1, High-Dynamic/AI/flight_2, High-Dynamic/AI/flight_3, High-Dynamic/AI/flight_4, 
        
        Hover/AI/flight_1, Hover/AI/flight_2, Hover/AI/flight_3, Hover/RAW/flight_1, Hover/RAW/flight_2, Hover/RAW/flight_3, 
        
        Low-Dynamic/AI/flight_1, Low-Dynamic/AI/flight_2, Low-Dynamic/AI/flight_3, Low-Dynamic/AI/flight_4, Low-Dynamic/RAW/flight_1, Low-Dynamic/RAW/flight_2, Low-Dynamic/RAW/flight_3, Low-Dynamic/RAW/flight_4, Low-Dynamic/RAW/flight_5, 
        
        Medium-Dynamic/AI/flight_1, Medium-Dynamic/AI/flight_2, Medium-Dynamic/AI/flight_3, Medium-Dynamic/RAW/flight_1, Medium-Dynamic/RAW/flight_2, Medium-Dynamic/RAW/flight_3, 
        
        Yaw/AI/flight_1, Yaw/AI/flight_2, Yaw/AI/flight_3, Yaw/AI/flight_4, Yaw/AI/flight_5, Yaw/RAW/flight_1, Yaw/RAW/flight_2, Yaw/RAW/flight_3, Yaw/RAW/flight_4]
        }
    ]
    gravity: 9.81007
    # Apply the known post-landing exclusion during windowed inspection.
    # Whole-flight inference keeps the complete trajectory for integration.
    exclude_windows: [
        {
            sequence: "T-Lab_28th_July_dataset/RAW/flight_6"
            start_relative_seconds: 87.899
            end_relative_seconds: 92.800
        }
    ]
}
