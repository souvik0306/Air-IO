train:
{
    mode: train
    coordinate: body_coord
    data_list:
    [
        {name: TLab
        window_size: 200
        step_size: 4
        data_root: ./T-Lab_31st_July_dataset
        data_drive: [RAW/flight_1, RAW/flight_3, RAW/flight_5, RAW/flight_7, UN/flight_1, UN/flight_3, UN/flight_5, UN/flight_7]
        },
        {name: TLab
        window_size: 200
        step_size: 4
        data_root: ./T-Lab_28th_July_dataset
        data_drive: [RAW/flight_4, RAW/flight_7, RAW/flight_6, UN/flight_1, UN/flight_4, UN/flight_5]
        },
        # Flight-number split keeps September train/test/eval trajectories disjoint
        # while exposing the GMM sampler to every recorded motion regime.
        {name: TLab
        window_size: 200
        step_size: 4
        data_root: ./T-Lab_10th_September_dataset
        data_drive: [
        High-Dynamic/AI/flight_1, High-Dynamic/AI/flight_3, High-Dynamic/RAW/flight_1, High-Dynamic/RAW/flight_3, 

        Hover/AI/flight_1, Hover/RAW/flight_1, 

        Low-Dynamic/AI/flight_1, Low-Dynamic/AI/flight_3, Low-Dynamic/RAW/flight_1, Low-Dynamic/RAW/flight_3, Low-Dynamic/RAW/flight_5, 

        Medium-Dynamic/AI/flight_1, Medium-Dynamic/RAW/flight_1, 

        Yaw/AI/flight_1, Yaw/AI/flight_3, Yaw/AI/flight_5, Yaw/RAW/flight_1, Yaw/RAW/flight_3]
        }
    ]
    gravity: 9.81007
    # Post-landing flip/accident in 28 July RAW flight 6. Any one-second
    # training window overlapping this relative-time interval is discarded.
    exclude_windows: [
        {
            sequence: "T-Lab_28th_July_dataset/RAW/flight_6"
            start_relative_seconds: 87.899
            end_relative_seconds: 92.800
        }
    ]
}

